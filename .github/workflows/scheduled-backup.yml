name: پشتیبان‌گیری خودکار مدرسه (Scheduled D1 Backup)

# چرا اینجا و نه سمت خودِ Cloudflare:
# Cloudflare D1 هیچ export زمان‌بندی‌شده‌ی داخلی نداره، و این پروژه از R2
# (یا هر blob storage دیگه) استفاده نمی‌کنه که یه Cron Trigger داخل خودِ
# Worker بتونه نتیجه رو جایی ذخیره کنه. GitHub Actions یه اجراکننده‌ی
# زمان‌بندی‌شده‌ی رایگانه که بیرون از Cloudflare کار می‌کنه -- دقیقاً همون
# «اسکریپت خارجی» که در README قدم ۱۵ بهش اشاره شده بود.

on:
  schedule:
    # هر روز ساعت ۰۲:۳۰ به وقت تهران (۲۲:۰۰ UTC روز قبل). اگه می‌خواید
    # ساعت دیگه‌ای باشه، این خط رو عوض کنید (فرمت cron همیشه بر اساس UTC است).
    - cron: "0 22 * * *"
  workflow_dispatch: {} # دکمه‌ی "Run workflow" برای اجرای دستی هم فعال می‌شه

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: ورود و دریافت خروجی پشتیبان
        env:
          BASE_URL: ${{ secrets.MADRESE_BASE_URL }}
          SCHOOL_ID: ${{ secrets.MADRESE_SCHOOL_ID }}
          ADMIN_USERNAME: ${{ secrets.MADRESE_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.MADRESE_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          echo "در حال ورود..."
          LOGIN_RESPONSE=$(curl -sf -X POST "$BASE_URL/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"school_id\": $SCHOOL_ID, \"username\": \"$ADMIN_USERNAME\", \"password\": \"$ADMIN_PASSWORD\"}")

          TOKEN=$(echo "$LOGIN_RESPONSE" | jq -r '.data.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" == "null" ]; then
            echo "::error::ورود ناموفق بود -- توکنی برنگشت"
            exit 1
          fi

          echo "در حال دریافت خروجی..."
          FILENAME="madrese-backup-$(date +%Y-%m-%d).json"
          curl -sf "$BASE_URL/api/admin/backup" \
            -H "Authorization: Bearer $TOKEN" \
            -o "$FILENAME"

          echo "خروج از نشست..."
          curl -sf -X POST "$BASE_URL/api/auth/logout" \
            -H "Authorization: Bearer $TOKEN" || true

          echo "BACKUP_FILE=$FILENAME" >> "$GITHUB_ENV"

      - name: بارگذاری فایل به‌عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: madrese-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30 # حداکثر ۹۰ روز در GitHub -- عدد کمتر یعنی فضای کمتر مصرف می‌شه

# اگه این workflow به هر دلیلی fail بشه (مثلاً سایت پایین بود)، GitHub خودش
# خودکار یک ایمیل به صاحب ریپازیتوری می‌فرسته -- یعنی همین یک فایل هم مثل
# health-check قدم ۱۵ عمل می‌کنه: اگه backup چند روز پشت‌سرهم fail بشه، خبردار می‌شید.
